runtime: nodejs22
env: standard
instance_class: F2

automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: "production"

# API keys should be set via:
#   gcloud app deploy --set-env-vars ANTHROPIC_API_KEY=...,SERPER_API_KEY=...
# Or use Secret Manager for production:
#   gcloud secrets create anthropic-api-key --data-file=...
