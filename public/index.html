<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Open Beach - Find Volleyball Near You</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">🏐</span>
        <h1>Open Beach</h1>
      </div>
    </div>
  </header>

  <!-- Location Bar -->
  <div class="location-bar">
    <div class="location-input-wrapper">
      <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="location-input" placeholder="Enter city or area..." autocomplete="off">
      <button id="gps-btn" class="gps-button" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Search Type Tabs -->
  <div class="search-tabs" id="search-tabs">
    <button class="tab-btn active" data-tab="openplay">Open Play</button>
    <button class="tab-btn" data-tab="tournaments">Tournaments</button>
  </div>

  <!-- Date Filter -->
  <div class="date-filter" id="date-filter">
    <!-- Generated by JS -->
  </div>

  <!-- View Toggle -->
  <div class="view-toggle">
    <button id="btn-map" class="toggle-btn active">Map</button>
    <button id="btn-list" class="toggle-btn">List</button>
  </div>

  <!-- Map View -->
  <div id="map-container" class="view-panel active">
    <div id="map"></div>
  </div>

  <!-- List View -->
  <div id="list-container" class="view-panel">
    <div id="event-list" class="event-list">
      <div class="empty-state">
        <div class="empty-icon">🏐</div>
        <p>Search for a location to find open play sessions</p>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-content">
      <div class="spinner"></div>
      <p id="loading-text">Searching for volleyball sessions...</p>
      <div class="loading-progress-track">
        <div id="loading-progress" class="loading-progress-bar"></div>
      </div>
      <p id="loading-detail" class="loading-detail">Our AI agent is searching venue websites and event platforms</p>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- App Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/location.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/list.js"></script>
  <script src="/js/filters.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
